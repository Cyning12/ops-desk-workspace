# Nginx site for Ops Desk (www.cynaya.cn).
# Install: scp to server, then:
#   sudo cp ops-desk.conf /etc/nginx/sites-available/ops-desk
#   sudo ln -sf /etc/nginx/sites-available/ops-desk /etc/nginx/sites-enabled/ops-desk
#   sudo nginx -t && sudo systemctl reload nginx
# Requires certs at /etc/nginx/ssl/cynaya.cn.{crt,key} (see deploy README §SSL).

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name cynaya.cn www.cynaya.cn;
    return 301 https://www.cynaya.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cynaya.cn www.cynaya.cn;

    ssl_certificate     /etc/nginx/ssl/cynaya.cn.crt;
    ssl_certificate_key /etc/nginx/ssl/cynaya.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Apex -> www
    if ($host = cynaya.cn) {
        return 301 https://www.cynaya.cn$request_uri;
    }

    root /opt/ops-desk/web/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    client_max_body_size 10m;

    # API reverse proxy (loopback only upstream)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (chat stream): no buffering, long-lived responses
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Hashed static assets: long cache
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
