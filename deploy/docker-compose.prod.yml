# Production compose: db + api + qdrant (web is static files served by Nginx).
# Usage on server: docker compose -f /opt/ops-desk/deploy/docker-compose.prod.yml --env-file /opt/ops-desk/.env up -d --build
#
# Qdrant 切流：先 up qdrant → 灌库对账 → 再在 /opt/ops-desk/.env 设 RAG_VECTOR_BACKEND=qdrant
# 见 ops-desk-api/docs/deployment/qdrant-cutover.md
services:
  db:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      POSTGRES_DB: opsdesk
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No host port: reachable only inside the compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d opsdesk"]
      interval: 5s
      timeout: 5s
      retries: 12

  # 稠密向量副本；不映射公网端口（仅 compose 内网 http://qdrant:6333）
  # 2C4G 整机：qdrant 建议 ≤2g，给 db+api 留余量（本地开发可用更高 mem_limit）
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    mem_limit: 2048m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ../api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"  # loopback only; Nginx proxies /api here
    environment:
      DATABASE_URL: postgresql+asyncpg://ops:${DB_PASSWORD}@db:5432/opsdesk
      OPS_DESK_SECRET: ${OPS_DESK_SECRET:?OPS_DESK_SECRET required}
      OPS_DESK_AUTH_MODE: db
      OPS_LLM_PROVIDER: ${OPS_LLM_PROVIDER:-siliconflow}
      OPS_LLM_MODEL: ${OPS_LLM_MODEL:-}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY}
      BAILIAN_API_KEY: ${BAILIAN_API_KEY}
      BAILIAN_BASE_URL: ${BAILIAN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      BAILIAN_MODEL: ${BAILIAN_MODEL:-qwen-plus}
      OPS_CHAT_WS_ENABLED: ${OPS_CHAT_WS_ENABLED:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://www.cynaya.cn}
      SUPABASE_DATABASE_URL: ${SUPABASE_DATABASE_URL:-}
      # 切流前默认仍读 pgvector；在 .env 显式设 qdrant 后再切读
      RAG_VECTOR_BACKEND: ${RAG_VECTOR_BACKEND:-pgvector}
      RAG_QDRANT_SHADOW_WRITE: ${RAG_QDRANT_SHADOW_WRITE:-false}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-ops_knowledge}
      # 查询期 HNSW ef；未写 .env 时默认 30（与 api backend 默认一致）
      QDRANT_HNSW_EF: ${QDRANT_HNSW_EF:-30}
      RAG_FTS_CONFIG: ${RAG_FTS_CONFIG:-simple}
      RAG_KW_EXPAND: ${RAG_KW_EXPAND:-false}
      RAG_EMBED_BACKEND: ${RAG_EMBED_BACKEND:-siliconflow}
      RAG_EMBED_MODEL: ${RAG_EMBED_MODEL:-BAAI/bge-m3}
      RAG_RERANK_ENABLED: ${RAG_RERANK_ENABLED:-true}
      RAG_RERANK_BACKEND: ${RAG_RERANK_BACKEND:-siliconflow}
      RAG_RERANK_MIN_SCORE: ${RAG_RERANK_MIN_SCORE:-0.4}
      RAG_RERANK_SCORE_RATIO: ${RAG_RERANK_SCORE_RATIO:-0.75}
      RAG_GRADER_PROMPT: ${RAG_GRADER_PROMPT:-v1}
      RAG_GRADER_PROVIDER: ${RAG_GRADER_PROVIDER:-bailian}
      RAG_GRADER_MODEL: ${RAG_GRADER_MODEL:-qwen3.7-flash}
      RAG_LC_ANSWER_PROVIDER: ${RAG_LC_ANSWER_PROVIDER:-}
      RAG_LC_ANSWER_MODEL: ${RAG_LC_ANSWER_MODEL:-}
      OPS_CHAT_TRACER: ${OPS_CHAT_TRACER:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      # 仓内 LANGFUSE_ENV → SDK LANGFUSE_TRACING_ENVIRONMENT；默认 prod
      LANGFUSE_ENV: ${LANGFUSE_ENV:-prod}
      # 生产访问不了 huggingface.co；须与 /opt/ops-desk/.env 同名键一起改
      HF_ENDPOINT: ${HF_ENDPOINT:-}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      OPS_ADMIN_SYNC_TOKEN: ${OPS_ADMIN_SYNC_TOKEN:-}
      # ---- Capability 治理 · HITL 审批 · 图挂起点（2026-09-21 补）----
      # ⚠️ 纪律：**只改服务器 /opt/ops-desk/.env 而这里没声明 = 容器里根本看不到**。
      #    加一个键要同时改两处（本文件 + deploy/.env.example）。
      #
      # 防重与回执落库。**只有 db 算 production-safe**（空=不落库，不可上生产）
      OPS_CAPABILITY_PERSISTENCE: ${OPS_CAPABILITY_PERSISTENCE:-db}
      # 额外能力清单：**必须显式列出**（禁止目录扫描，不列就不加载）。
      # 容器内 WORKDIR=/app 且 COPY . . ⇒ 清单落在 /app/app/ops/...（用绝对路径，不受 CWD 影响）
      OPS_CAPABILITY_EXTRA_MANIFESTS: ${OPS_CAPABILITY_EXTRA_MANIFESTS:-/app/app/ops/capability/manifests/oa.readonly.v1.yaml}
      # 运维停用闸：逗号分隔的**匹配模式列表**（不是布尔）。空=不停用；`*`=全停
      OPS_CAPABILITY_KILL_SWITCH: ${OPS_CAPABILITY_KILL_SWITCH:-}
      # 熔断状态后端：memory（单实例）| redis（多实例，须同时给 CB_REDIS_URL）。
      # ⚠️ 代码默认的 mock-unavailable 是**刻意让存储不可用**的测试模式（逼回落路径被走到），
      #    生产沿用会让熔断状态在观测里一直是 degraded。
      OPS_CAPABILITY_CB_BACKEND: ${OPS_CAPABILITY_CB_BACKEND:-memory}
      OPS_CAPABILITY_CB_REDIS_URL: ${OPS_CAPABILITY_CB_REDIS_URL:-}
      # OA 网关：清单里只写凭证名，值来自下面这个键；base_url 读的是 OA_BASE
      OA_BASE: ${OA_BASE:-}
      OPS_CAP_CRED_OA_GATEWAY_TOKEN: ${OPS_CAP_CRED_OA_GATEWAY_TOKEN:-}
      # HITL 审批申请落库（db）+ 回调签名密钥。
      # **密钥为空 = 回调端点拒绝一切请求**（不设密钥=不开放），OA 审批会恒定 401
      OPS_HITL_PERSISTENCE: ${OPS_HITL_PERSISTENCE:-db}
      OPS_HITL_CALLBACK_SECRET: ${OPS_HITL_CALLBACK_SECRET:-}
      # 图挂起点。空 = 内存 saver ⇒ 跨请求恢复**不可能成立**，恢复端点会显式 503
      LG_RAG_HTTP_CHECKPOINTER: ${LG_RAG_HTTP_CHECKPOINTER:-postgres}
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health',timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  pgdata:
  qdrant_data:
